# ─────────────────────────────────────────────────────────────
# Stack de gosalvez.es
#
# Portainer lo despliega directamente desde GitHub:
#   Stacks → Add stack → Repository
#     Repository URL:  https://github.com/agosalvez/cv
#     Reference:       refs/heads/main
#     Compose path:    docker-stack.yml
#
# Los valores de las variables se definen en "Environment variables"
# del propio stack en Portainer. Ninguna vive en el repositorio.
# ─────────────────────────────────────────────────────────────
version: '3.3'

services:

  cv:
    image: ${DOCKERHUB_USERNAME}/cv:latest
    restart: unless-stopped
    volumes:
      - cv-data:/app/src/data
      - cv-public:/app/public
    environment:
      # ── Panel de administración ──────────────────────────
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASS=${ADMIN_PASS}

      # ── Solicitudes de /formacion ────────────────────────
      # El correo lo envía el servidor: CONTACT_TO no llega
      # nunca al navegador ni aparece en el repositorio.
      #
      # Basta con definir UNA de las dos claves. Si están las
      # dos, se usa Brevo. Las variables que no se usen pueden
      # quedarse vacías.
      - CONTACT_TO=${CONTACT_TO}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_EMAIL_FROM=${BREVO_EMAIL_FROM}
      - BREVO_EMAIL_FROM_NAME=${BREVO_EMAIL_FROM_NAME}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_EMAIL_FROM=${SENDGRID_EMAIL_FROM}
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cv-v3.entrypoints=web"
      - "traefik.http.routers.cv-v3.middlewares=middleware-secure"
      - "traefik.http.routers.cv-v3.rule=Host(`adrian.gosalvez.es`) || Host(`gosalvez.es`)"
      - "traefik.http.routers.cv-v3-secure.tls=true"
      - "traefik.http.routers.cv-v3-secure.tls.certresolver=myresolver"
      - "traefik.http.routers.cv-v3-secure.entrypoints=websecure"
      - "traefik.http.routers.cv-v3-secure.rule=Host(`adrian.gosalvez.es`) || Host(`gosalvez.es`)"

volumes:
  cv-data:    # cv.json
  cv-public:  # profile.jpg y logos/

networks:
  traefik:
    external: true
