<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" width="1600" height="1067" role="img" aria-label="FOTO 3 — Trabajando">
  <defs>
    <pattern id="rejilla" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1067" fill="#f8fafc"/>
  <rect width="1600" height="1067" fill="url(#rejilla)"/>
  <rect x="12" y="12" width="1576" height="1043" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="14 10" rx="10"/>

  <g transform="translate(800 213)">
    <circle r="46" fill="#1d4ed8" opacity="0.08"/>
    <g stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-24 -20) scale(2)">
      <path d="M2 6.5A1.5 1.5 0 0 1 3.5 5h2L7 3h6l1.5 2h2A1.5 1.5 0 0 1 18 6.5v9A1.5 1.5 0 0 1 16.5 17h-13A1.5 1.5 0 0 1 2 15.5z"/>
      <circle cx="10" cy="11" r="3.5"/>
    </g>
  </g>

  <text x="800" y="357" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="60" font-weight="700" fill="#0f172a">FOTO 3 — Trabajando</text>
  <text x="800" y="411" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="35" fill="#64748b">Sección de quién imparte. Refuerza el perfil técnico.</text>

  <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="32">
    <text x="256" y="500" fill="#2563eb" font-weight="600">Encuadre</text>
    <text x="544" y="500" fill="#334155">Horizontal 3:2. Plano medio, desde un lado.</text>
    <text x="256" y="554" fill="#2563eb" font-weight="600">Vestuario</text>
    <text x="544" y="554" fill="#334155">Camisa o jersey liso. Informal pero cuidado.</text>
    <text x="256" y="608" fill="#2563eb" font-weight="600">Postura</text>
    <text x="544" y="608" fill="#334155">Sentado ante el portátil, trabajando de verdad.</text>
    <text x="544" y="662" fill="#334155">Sin mirar a cámara. Atención en la pantalla.</text>
    <text x="256" y="716" fill="#2563eb" font-weight="600">Escena</text>
    <text x="544" y="716" fill="#334155">Tu escritorio real. Que se vea el espacio.</text>
    <text x="256" y="770" fill="#2563eb" font-weight="600">Evitar</text>
    <text x="544" y="770" fill="#334155">Manos sobre el teclado sin escribir, sonrisa</text>
    <text x="544" y="824" fill="#334155">a cámara, escritorio vacío de atrezzo.</text>
  </g>

  <text x="800" y="1003" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="27" fill="#94a3b8">Sustituir por la foto real · 1600×1067 aprox.</text>
</svg>
