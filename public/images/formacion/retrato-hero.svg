<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="FOTO 1 — Retrato principal">
  <defs>
    <pattern id="rejilla" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="1250" fill="#f8fafc"/>
  <rect width="1000" height="1250" fill="url(#rejilla)"/>
  <rect x="12" y="12" width="976" height="1226" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="14 10" rx="10"/>

  <g transform="translate(500 250)">
    <circle r="46" fill="#1d4ed8" opacity="0.08"/>
    <g stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-24 -20) scale(2)">
      <path d="M2 6.5A1.5 1.5 0 0 1 3.5 5h2L7 3h6l1.5 2h2A1.5 1.5 0 0 1 18 6.5v9A1.5 1.5 0 0 1 16.5 17h-13A1.5 1.5 0 0 1 2 15.5z"/>
      <circle cx="10" cy="11" r="3.5"/>
    </g>
  </g>

  <text x="500" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="700" fill="#0f172a">FOTO 1 — Retrato principal</text>
  <text x="500" y="374" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#64748b">Cabecera de la página. Es la más importante.</text>

  <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="20">
    <text x="160" y="430" fill="#2563eb" font-weight="600">Encuadre</text>
    <text x="340" y="430" fill="#334155">Vertical 4:5. De la cintura para arriba.</text>
    <text x="160" y="464" fill="#2563eb" font-weight="600">Vestuario</text>
    <text x="340" y="464" fill="#334155">Camisa lisa, sin corbata, sin americana.</text>
    <text x="340" y="498" fill="#334155">Azul, blanco o gris. Nada de estampados.</text>
    <text x="160" y="532" fill="#2563eb" font-weight="600">Postura</text>
    <text x="340" y="532" fill="#334155">De pie, de frente, brazos relajados</text>
    <text x="340" y="566" fill="#334155">o cruzados. Mirando a cámara.</text>
    <text x="160" y="600" fill="#2563eb" font-weight="600">Expresión</text>
    <text x="340" y="600" fill="#334155">Sonrisa leve, cerrada. Serio pero cercano.</text>
    <text x="160" y="634" fill="#2563eb" font-weight="600">Fondo</text>
    <text x="340" y="634" fill="#334155">Oficina o pared lisa, desenfocado.</text>
    <text x="160" y="668" fill="#2563eb" font-weight="600">Luz</text>
    <text x="340" y="668" fill="#334155">De ventana, de lado. Nunca flash directo.</text>
  </g>

  <text x="500" y="1210" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#94a3b8">Sustituir por la foto real · 1000×1250 aprox.</text>
</svg>
